name: Plan claims gate

# Required-check candidate (dependency D1). Runs on EVERY pull request (no path
# filter) and always completes. It succeeds with an explicit "not applicable"
# result when no governed file changed.
#
# Tamper resistance: pull_request_target runs this workflow file and the gate
# script from the protected BASE revision. The PR head is fetched as git objects
# only. It is never checked out, imported or executed. No secrets are used, the
# token is read-only, and credentials are not persisted.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: plan-claims-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan-claims-gate:
    name: plan-claims-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the protected base revision (trusted gate code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as data only (never checked out or executed)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: git fetch --no-tags --no-recurse-submodules "https://github.com/${REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Verify governed changes with the base-revision checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/plan_claims_gate.py --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
