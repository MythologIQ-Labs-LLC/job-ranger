name: Build Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref to build. With publish on: an existing release tag such as v1.3.0-rc.1. With publish off: any branch, tag or commit SHA"
        required: true
        type: string
      publish:
        description: "Create or update the public GitHub release and upload the assets. Off builds a private, tester-only candidate kept as a workflow artifact"
        required: true
        default: false
        type: boolean
      platform:
        description: "Which release assets to build (macOS native builds are historical/manual only)"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - windows-store
          - web
          - macos
          - all

permissions:
  contents: write

env:
  # A pushed v* tag always publishes. A manual run publishes only when the
  # dispatcher turns publish on; otherwise nothing reaches a GitHub release,
  # the attestation log or the Store, and the build stays a workflow artifact.
  PUBLISH_RELEASE: ${{ (github.event_name == 'push' || inputs.publish) && 'true' || 'false' }}

# Distribution architecture (docs/design/DISTRIBUTION_ARCHITECTURE.md):
# - supported channels are the Microsoft Store package and the web/PWA build;
# - the direct-download NSIS installer is an advanced/test artifact unless it
#   is signed (Azure Artifact Signing is optional and never blocks a release);
# - native macOS packaging is not part of the forward architecture and only
#   runs on explicit manual dispatch.
# Every produced artifact gets SHA-256 evidence, a release manifest, and a
# GitHub artifact attestation (SLSA build provenance).

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve target tag and trust mode
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Azure Artifact Signing is optional. Signing is required only when
          # the repository explicitly opts in; an unsigned direct installer is
          # published as an advanced/test artifact, never as the mainstream path.
          if [[ "${{ vars.JOB_RANGER_REQUIRE_WINDOWS_SIGNING }}" == "1" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "JOB_RANGER_REQUIRE_WINDOWS_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "JOB_RANGER_REQUIRE_WINDOWS_SIGNING=0" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows signing configuration (opt-in)
        if: steps.release_tag.outputs.signed == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          JOB_RANGER_WINDOWS_SIGN_ENDPOINT: ${{ vars.JOB_RANGER_WINDOWS_SIGN_ENDPOINT }}
          JOB_RANGER_WINDOWS_SIGN_ACCOUNT: ${{ vars.JOB_RANGER_WINDOWS_SIGN_ACCOUNT }}
          JOB_RANGER_WINDOWS_SIGN_PROFILE: ${{ vars.JOB_RANGER_WINDOWS_SIGN_PROFILE }}
          JOB_RANGER_WINDOWS_SIGN_PUBLISHER: ${{ vars.JOB_RANGER_WINDOWS_SIGN_PUBLISHER }}
        run: |
          $required = @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "JOB_RANGER_WINDOWS_SIGN_ENDPOINT",
            "JOB_RANGER_WINDOWS_SIGN_ACCOUNT",
            "JOB_RANGER_WINDOWS_SIGN_PROFILE",
            "JOB_RANGER_WINDOWS_SIGN_PUBLISHER"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Stable public Windows release requires Artifact Signing configuration. Missing: $($missing -join ', ')"
          }

      - name: Provision pinned SQLite CLI
        uses: ./.github/actions/provision-windows-sqlite

      - name: Build release artifacts
        run: npm run electron:build:win
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          JOB_RANGER_WINDOWS_SIGN_ENDPOINT: ${{ vars.JOB_RANGER_WINDOWS_SIGN_ENDPOINT }}
          JOB_RANGER_WINDOWS_SIGN_ACCOUNT: ${{ vars.JOB_RANGER_WINDOWS_SIGN_ACCOUNT }}
          JOB_RANGER_WINDOWS_SIGN_PROFILE: ${{ vars.JOB_RANGER_WINDOWS_SIGN_PROFILE }}
          JOB_RANGER_WINDOWS_SIGN_PUBLISHER: ${{ vars.JOB_RANGER_WINDOWS_SIGN_PUBLISHER }}

      - name: Verify packaged SQLite runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourcesPath = (Resolve-Path "release/win-unpacked/resources").Path
          $packagedSqlite = Join-Path $resourcesPath "sqlite3.exe"
          if (-not (Test-Path -LiteralPath $packagedSqlite)) {
            throw "Packaged sqlite3.exe is missing from $resourcesPath."
          }
          & $packagedSqlite --version

          Remove-Item Env:SQLITE3_PATH -ErrorAction SilentlyContinue
          $resolved = node -e "process.resourcesPath=process.argv[1]; delete process.env.SQLITE3_PATH; require('./electron/sqlite.cjs').resolveSqliteBinary().then((p)=>process.stdout.write(require('path').resolve(p))).catch((e)=>{console.error(e); process.exit(1);})" $resourcesPath
          $expected = (Resolve-Path $packagedSqlite).Path
          if ($resolved.Trim() -ne $expected) {
            throw "Runtime resolver selected '$resolved' instead of packaged SQLite '$expected'."
          }

      - name: Run packaged Windows consumer smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          & ./scripts/run-packaged-smoke-windows.ps1 -AppVersion $version

      - name: Verify Windows distribution trust
        shell: pwsh
        run: |
          $requireSigned = "${{ steps.release_tag.outputs.signed }}" -eq "true"
          & ./scripts/verify-windows-distribution.ps1 -RequireSigned:$requireSigned

      - name: Generate Windows checksums and release manifest
        shell: bash
        run: |
          node scripts/generate-release-manifest.mjs \
            --platform windows \
            --tag "${{ steps.release_tag.outputs.tag }}" \
            --public "${{ steps.release_tag.outputs.signed }}" \
            --trust-evidence windows-signing.json \
            --smoke-evidence windows-package-smoke.json

      - name: Attest build provenance (direct-download installer)
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Job*windows*.exe

      - name: Ensure GitHub release exists
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi

          if [[ "$tag" == *-rc.* || "$tag" == *-beta* ]]; then
            create_args=(--title "Job Ranger $tag" --generate-notes --prerelease)
          else
            create_args=(--title "Job Ranger $tag" --generate-notes)
          fi

          if ! gh release create "$tag" "${create_args[@]}"; then
            gh release view "$tag" >/dev/null
          fi

      - name: Upload release assets and validation evidence
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" \
            release/Job*windows*.exe \
            release/Job*windows*.exe.blockmap \
            release/latest.yml \
            build/trust/windows-signing.json \
            build/trust/windows-package-smoke.json \
            build/trust/windows-SHA256SUMS.txt \
            build/trust/windows-release-manifest.json \
            --clobber

      - name: Keep build-only candidate as a workflow artifact
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-ranger-windows-build-only-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/Job*windows*.exe
            release/Job*windows*.exe.blockmap
            build/trust/windows-signing.json
            build/trust/windows-package-smoke.json
            build/trust/windows-SHA256SUMS.txt
            build/trust/windows-release-manifest.json

  build-macos:
    # Historical/manual only: native macOS distribution is not part of the
    # accepted architecture (macOS users are served by the web/PWA runtime).
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve target tag and trust mode
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "JOB_RANGER_REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "JOB_RANGER_REQUIRE_NOTARIZATION=0" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public macOS signing configuration
        if: steps.release_tag.outputs.public == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CSC_LINK:-}" ]] || missing+=(MAC_CSC_LINK)
          [[ -n "${CSC_KEY_PASSWORD:-}" ]] || missing+=(MAC_CSC_KEY_PASSWORD)
          [[ -n "${APPLE_ID:-}" ]] || missing+=(APPLE_ID)
          [[ -n "${APPLE_ID_PASSWORD:-}" ]] || missing+=(APPLE_ID_PASSWORD)
          [[ -n "${APPLE_TEAM_ID:-}" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            printf 'Stable public macOS release requires Developer ID signing and notarization credentials. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify system SQLite for release smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/sqlite3
          /usr/bin/sqlite3 --version

      - name: Generate macOS icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/icon.iconset
          sips -z 16 16 public/ICON.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 public/ICON.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 public/ICON.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 public/ICON.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 public/ICON.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 public/ICON.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 public/ICON.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 public/ICON.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 public/ICON.png --out build/icon.iconset/icon_512x512.png
          cp public/ICON.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build release artifacts
        run: npm run electron:build:mac
        env:
          SQLITE3_PATH: /usr/bin/sqlite3
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Run packaged macOS consumer smoke
        shell: bash
        run: bash scripts/run-packaged-smoke-macos.sh "$(node -p "require('./package.json').version")"

      - name: Verify macOS distribution trust
        shell: bash
        run: bash scripts/verify-macos-distribution.sh "${{ steps.release_tag.outputs.public == 'true' && '1' || '0' }}"

      - name: Generate macOS checksums and release manifest
        shell: bash
        run: |
          node scripts/generate-release-manifest.mjs \
            --platform macos \
            --tag "${{ steps.release_tag.outputs.tag }}" \
            --public "${{ steps.release_tag.outputs.public }}" \
            --trust-evidence macos-signing.txt \
            --smoke-evidence macos-package-smoke.json

      - name: Ensure GitHub release exists
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi

          if [[ "$tag" == *-rc.* || "$tag" == *-beta* ]]; then
            create_args=(--title "Job Ranger $tag" --generate-notes --prerelease)
          else
            create_args=(--title "Job Ranger $tag" --generate-notes)
          fi

          if ! gh release create "$tag" "${create_args[@]}"; then
            gh release view "$tag" >/dev/null
          fi

      - name: Upload release assets and validation evidence
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" \
            release/Job*macos*.dmg \
            release/Job*macos*.zip \
            build/trust/macos-signing.txt \
            build/trust/macos-package-smoke.json \
            build/trust/macos-SHA256SUMS.txt \
            build/trust/macos-release-manifest.json \
            --clobber

      - name: Keep build-only candidate as a workflow artifact
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-ranger-macos-build-only-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/Job*macos*.dmg
            release/Job*macos*.zip
            build/trust/macos-signing.txt
            build/trust/macos-package-smoke.json
            build/trust/macos-SHA256SUMS.txt
            build/trust/macos-release-manifest.json

  store-package:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows-store'
    uses: ./.github/workflows/windows-store-package.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      submission: ${{ vars.JOB_RANGER_STORE_IDENTITY_NAME != '' }}

  publish-store-package:
    needs: store-package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Store package and evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.store-package.outputs.artifact-name }}
          path: store

      - name: Attest build provenance (Store package)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: store/release/Job*windows-store*.appx

      - name: Upload Store package candidate and evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Job Ranger $tag" --generate-notes --prerelease
          gh release upload "$tag" store/release/Job*windows-store*.appx store/build/trust/windows-store-* --clobber

  web:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'web'
    uses: ./.github/workflows/pwa.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  publish-web:
    needs: web
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download web build and evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.web.outputs.artifact-name }}
          path: web

      - name: Attest build provenance (web build)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: web/release/job-ranger-web-*.zip

      - name: Upload web build and evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Job Ranger $tag" --generate-notes --prerelease
          gh release upload "$tag" web/release/job-ranger-web-*.zip web/build/trust/web-* --clobber
