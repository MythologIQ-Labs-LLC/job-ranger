name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repository-health:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high-severity dependency vulnerabilities
        run: node scripts/audit-dependencies.mjs

      - name: Run explicit release-candidate unit suite
        if: startsWith(github.head_ref, 'release/')
        run: npm run test:unit

      - name: Typecheck, build, and smoke test
        run: npm run repo:health

      - name: Run Electron E2E for release-line pull requests
        if: startsWith(github.head_ref, 'release/')
        run: xvfb-run -a npm run test:e2e

  release-upgrade:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify upgrade from the latest published release
        run: npm run test:release-upgrade

      - name: Upload upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-report
          path: build/trust/release-upgrade-report.json
          if-no-files-found: ignore

  # Same upgrade verification on a Windows host (sqlite3.exe emits CRLF).
  release-upgrade-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision SQLite CLI
        uses: ./.github/actions/provision-windows-sqlite

      - name: Verify upgrade from the latest published release
        run: npm run test:release-upgrade

      - name: Upload upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-report-windows
          path: build/trust/release-upgrade-report.json
          if-no-files-found: ignore
